<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>datacat</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app">
    <aside id="nav">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="#6D4BD1"/>
          <polygon points="7,16 11.2,6.2 15.2,16" fill="#F4F0FF"/>
          <polygon points="16.8,16 20.8,6.2 25,16" fill="#F4F0FF"/>
          <polygon points="9,15.2 11.2,9 13.4,15.2" fill="#D9CEF8"/>
          <polygon points="18.6,15.2 20.8,9 23,15.2" fill="#D9CEF8"/>
          <circle cx="16" cy="19.2" r="8" fill="#F4F0FF"/>
          <circle cx="13" cy="18.6" r="1.15" fill="#2A1848"/>
          <circle cx="19" cy="18.6" r="1.15" fill="#2A1848"/>
          <polygon points="16,20.6 15.15,21.7 16.85,21.7" fill="#6D4BD1"/>
          <path d="M14.2 23 Q16 24.2 17.8 23" fill="none" stroke="#6D4BD1" stroke-width="0.9" stroke-linecap="round"/>
        </svg>
        <div>
          <div class="brand-name">datacat</div>
          <div class="brand-sub">observability</div>
        </div>
      </div>
      <div class="nav-scroll">
        <div class="nav-label">Observe</div>
        <button class="nav-item active" data-action="nav" data-view="dashboards">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M1 1h6.2v6.2H1zm7.6 0H15v6.2H8.6zM1 8.8h6.2V15H1zm7.6 0H15V15H8.6z"/></svg>
          Dashboards
        </button>
        <button class="nav-item" data-action="nav" data-view="monitors">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.4" d="M1 8h2.2l1.6-4 2.4 8 1.8-4H15"/></svg>
          Monitors
        </button>
        <button class="nav-item" data-action="nav" data-view="incidents">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 1.2 15 14H1L8 1.2zm0 4.2c-.4 0-.7.3-.7.7v3.2c0 .4.3.7.7.7s.7-.3.7-.7V6.1c0-.4-.3-.7-.7-.7zm0 6.1a.9.9 0 1 0 0 1.8.9.9 0 0 0 0-1.8z"/></svg>
          Incidents
          <span id="incident-badge" class="nav-badge" hidden>0</span>
        </button>
        <button class="nav-item" data-action="nav" data-view="events">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M2 3h12v1.4H2zm0 4.1h12v1.4H2zM2 11.2h8V12.6H2z"/></svg>
          Events
        </button>
        <div class="nav-label">Configure</div>
        <button class="nav-item" data-action="nav" data-view="integrations">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M6.2 1h3.6v2.1h1.4c.7 0 1.3.6 1.3 1.3v1.2h2.4v3.2h-2.4v1.2c0 .7-.6 1.3-1.3 1.3H9.8V15H6.2v-2.7H4.8c-.7 0-1.3-.6-1.3-1.3V9.8H1.1V6.6h2.4V5.4c0-.7.6-1.3 1.3-1.3h1.4V1z"/></svg>
          Integrations
        </button>
      </div>
      <div class="nav-foot">
        <span id="gen-dot" class="live-dot"></span>
        <span id="gen-label">Generator</span>
      </div>
    </aside>
    <div id="main">
      <header id="topbar">
        <div id="crumb" class="crumb">Dashboards / freshcart</div>
        <label class="search">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.2 10.2 14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          <input id="search" type="search" placeholder="Search metrics and monitors" autocomplete="off">
        </label>
        <div class="top-actions">
          <button id="live-btn" class="live-btn" data-action="pause" type="button">
            <span id="live-dot" class="live-dot"></span>
            <span id="live-label">Live</span>
          </button>
          <div class="picker" id="time-picker"></div>
          <div class="picker" id="env-picker"></div>
          <button id="push-btn" class="push-btn" data-action="toggle-push" type="button">
            <span id="push-switch" class="switch" aria-hidden="true"></span>
            <span>Snapshot push</span>
          </button>
        </div>
      </header>
      <div id="banner"></div>
      <div id="view">
        <p class="loading">Loading samples…</p>
      </div>
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
